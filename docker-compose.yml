
services:
  Color_in_memory:
    image: python:3.12.6
    container_name: color
    working_dir: /app
    #ports:
    #  - "${PORT:-12835}:8383"
    environment:
      - ANALYTICS_URL=${ANALYTICS_URL:-}
      - ANALYTICS_UUID=${ANALYTICS_UUID:-}
    command: >
      /bin/bash -c "pip install -q -r requirements.txt && python main.py"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - caddy

networks:
  caddy:
    external: true
